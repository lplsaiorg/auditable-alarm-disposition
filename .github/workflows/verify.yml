name: Verify research artifacts

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline-verification:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify frozen results and SHA-256 manifest
        run: python scripts/verify_saved_results.py
      - name: Test the executable evidence contract
        run: python -m unittest discover -s tests -v
      - name: Compile research entry points
        run: python -m compileall -q code scripts examples tests
